name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # The ONNX model weight is intentionally not fetched here: the build
      # must succeed without it (semantic search is an optional artifact).
      - name: Package
        run: node scripts/package.js

      - name: Upload .xpi artifact
        uses: actions/upload-artifact@v4
        with:
          name: claude-assistant-xpi
          path: dist/claude-assistant.xpi

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="pressureFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4cef50" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#4cef50" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <rect width="800" height="400" fill="url(#bg)" rx="12"/>

  <text x="400" y="30" text-anchor="middle" fill="#4cef50" font-size="15" font-weight="bold">IUIUIU Classic Profile (by Mor)</text>
  <text x="400" y="46" text-anchor="middle" fill="#888" font-size="10">93°C · 18g in → 36g out · 4 phases · Versatile all-rounder · 7.5 bar peak</text>

  <!-- Chart: x=70..760, y=65..310 -->
  <!-- Time axis: 0-45s, 1s = 15.3px, x(t) = 70 + t*15.3 -->
  <!-- Pressure: 0-9 bar, 1bar = 27.2px, y(p) = 310 - p*27.2 -->

  <!-- Grid -->
  <g stroke="#333" stroke-width="0.5" stroke-dasharray="3,6">
    <line x1="70" y1="282.8" x2="760" y2="282.8"/><!-- 1 -->
    <line x1="70" y1="255.6" x2="760" y2="255.6"/><!-- 2 -->
    <line x1="70" y1="228.4" x2="760" y2="228.4"/><!-- 3 -->
    <line x1="70" y1="201.2" x2="760" y2="201.2"/><!-- 4 -->
    <line x1="70" y1="174" x2="760" y2="174"/><!-- 5 -->
    <line x1="70" y1="146.8" x2="760" y2="146.8"/><!-- 6 -->
    <line x1="70" y1="119.6" x2="760" y2="119.6"/><!-- 7 -->
    <line x1="70" y1="92.4" x2="760" y2="92.4"/><!-- 8 -->
    <line x1="70" y1="65" x2="760" y2="65"/><!-- 9 -->
    <!-- Vertical -->
    <line x1="147" y1="65" x2="147" y2="310"/><!-- 5s -->
    <line x1="223" y1="65" x2="223" y2="310"/><!-- 10s -->
    <line x1="300" y1="65" x2="300" y2="310"/><!-- 15s -->
    <line x1="376" y1="65" x2="376" y2="310"/><!-- 20s -->
    <line x1="453" y1="65" x2="453" y2="310"/><!-- 25s -->
    <line x1="529" y1="65" x2="529" y2="310"/><!-- 30s -->
    <line x1="606" y1="65" x2="606" y2="310"/><!-- 35s -->
    <line x1="682" y1="65" x2="682" y2="310"/><!-- 40s -->
    <line x1="760" y1="65" x2="760" y2="310"/><!-- 45s -->
  </g>
  <line x1="70" y1="310" x2="760" y2="310" stroke="#555" stroke-width="1"/>
  <line x1="70" y1="65" x2="70" y2="310" stroke="#555" stroke-width="1"/>

  <!-- Axis labels -->
  <text x="35" y="69" text-anchor="middle" fill="#aaa" font-size="9">9</text>
  <text x="35" y="123" text-anchor="middle" fill="#aaa" font-size="9">7</text>
  <text x="35" y="178" text-anchor="middle" fill="#aaa" font-size="9">5</text>
  <text x="35" y="232" text-anchor="middle" fill="#aaa" font-size="9">3</text>
  <text x="35" y="287" text-anchor="middle" fill="#aaa" font-size="9">1</text>
  <text x="35" y="314" text-anchor="middle" fill="#aaa" font-size="9">0</text>

  <text x="70" y="328" text-anchor="middle" fill="#aaa" font-size="9">0s</text>
  <text x="147" y="328" text-anchor="middle" fill="#aaa" font-size="9">5</text>
  <text x="223" y="328" text-anchor="middle" fill="#aaa" font-size="9">10</text>
  <text x="300" y="328" text-anchor="middle" fill="#aaa" font-size="9">15</text>
  <text x="376" y="328" text-anchor="middle" fill="#aaa" font-size="9">20</text>
  <text x="453" y="328" text-anchor="middle" fill="#aaa" font-size="9">25</text>
  <text x="529" y="328" text-anchor="middle" fill="#aaa" font-size="9">30</text>
  <text x="606" y="328" text-anchor="middle" fill="#aaa" font-size="9">35</text>
  <text x="682" y="328" text-anchor="middle" fill="#aaa" font-size="9">40</text>
  <text x="760" y="328" text-anchor="middle" fill="#aaa" font-size="9">45</text>

  <text x="15" y="190" text-anchor="middle" fill="#ccc" font-size="10" transform="rotate(-90,15,190)">Pressure (bar)</text>
  <text x="415" y="345" text-anchor="middle" fill="#ccc" font-size="10">Time (seconds)</text>

  <!-- Phase dividers -->
  <line x1="223" y1="65" x2="223" y2="310" stroke="#4cef50" stroke-width="0.5" stroke-dasharray="4,4" opacity="0.4"/>
  <line x1="346" y1="65" x2="346" y2="310" stroke="#4cef50" stroke-width="0.5" stroke-dasharray="4,4" opacity="0.4"/>
  <line x1="423" y1="65" x2="423" y2="310" stroke="#4cef50" stroke-width="0.5" stroke-dasharray="4,4" opacity="0.4"/>

  <!-- Phase labels -->
  <text x="147" y="80" text-anchor="middle" fill="#4cef50" font-size="8" opacity="0.7">Preinfusion</text>
  <text x="285" y="80" text-anchor="middle" fill="#4cef50" font-size="8" opacity="0.7">Soak</text>
  <text x="385" y="80" text-anchor="middle" fill="#4cef50" font-size="8" opacity="0.7">Ramp</text>
  <text x="590" y="80" text-anchor="middle" fill="#4cef50" font-size="8" opacity="0.7">Extraction (Declining)</text>

  <!-- 7.5 bar reference line -->
  <line x1="346" y1="106" x2="760" y2="106" stroke="#4cef50" stroke-width="0.5" stroke-dasharray="2,4" opacity="0.3"/>
  <text x="765" y="110" text-anchor="start" fill="#4cef50" font-size="8" opacity="0.5">7.5</text>

  <!-- Pressure fill area -->
  <polygon points="70,310 223,201.2 290,255.6 346,255.6 423,106 500,120 600,140 700,146.8 760,150 760,310"
    fill="url(#pressureFill)"/>

  <!-- Pressure curve (green) -->
  <!-- Ph1: 0→4bar over ~10s (3ml/s flow, 4bar cap) -->
  <!-- Ph2: 4→2bar soak (pump off, ~8s, until <2bar) -->
  <!-- Ph3: 0→7.5bar over 5s (EASE_OUT) -->
  <!-- Ph4: 7.5→6bar over ~20s (EASE_IN_OUT, 3ml/s cap) -->
  <polyline points="70,310 223,201.2 290,255.6 346,255.6 423,106 500,120 600,140 700,146.8 760,150"
    fill="none" stroke="#4cef50" stroke-width="2.5"/>

  <!-- Key annotations -->
  <text x="225" y="194" text-anchor="start" fill="#4cef50" font-size="9" font-weight="bold">4 bar cap</text>
  <text x="346" y="262" text-anchor="end" fill="#888" font-size="8">2 bar</text>
  <text x="423" y="98" text-anchor="middle" fill="#4cef50" font-size="9" font-weight="bold">7.5 bar</text>
  <text x="760" y="143" text-anchor="end" fill="#4cef50" font-size="9" font-weight="bold">~6 bar</text>

  <!-- Phase detail boxes -->
  <rect x="70" y="352" width="150" height="38" rx="4" fill="#222" stroke="#444" stroke-width="0.5"/>
  <text x="145" y="366" text-anchor="middle" fill="#4cef50" font-size="9" font-weight="bold">PI: 3 ml/s · 4 bar cap</text>
  <text x="145" y="380" text-anchor="middle" fill="#888" font-size="8">until 4 bar OR 4g drip</text>

  <rect x="230" y="352" width="130" height="38" rx="4" fill="#222" stroke="#444" stroke-width="0.5"/>
  <text x="295" y="366" text-anchor="middle" fill="#4cef50" font-size="9" font-weight="bold">Soak: pump off</text>
  <text x="295" y="380" text-anchor="middle" fill="#888" font-size="8">until pressure &lt; 2 bar</text>

  <rect x="370" y="352" width="110" height="38" rx="4" fill="#222" stroke="#444" stroke-width="0.5"/>
  <text x="425" y="366" text-anchor="middle" fill="#4cef50" font-size="9" font-weight="bold">Ramp: 0→7.5 bar</text>
  <text x="425" y="380" text-anchor="middle" fill="#888" font-size="8">EASE_OUT · 5s</text>

  <rect x="490" y="352" width="250" height="38" rx="4" fill="#222" stroke="#444" stroke-width="0.5"/>
  <text x="615" y="366" text-anchor="middle" fill="#4cef50" font-size="9" font-weight="bold">Extract: 7.5 → 6 bar · 3 ml/s cap</text>
  <text x="615" y="380" text-anchor="middle" fill="#888" font-size="8">EASE_IN_OUT decline → 36g stop</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="pressureFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <rect width="800" height="400" fill="url(#bg)" rx="12"/>

  <text x="400" y="30" text-anchor="middle" fill="#00d4ff" font-size="15" font-weight="bold">Blooming Espresso Profile</text>
  <text x="400" y="46" text-anchor="middle" fill="#888" font-size="10">93°C · 18g in → 36g out · 4 phases · Scott Rao style · Best for light roasts</text>

  <!-- Chart: x=70..760, y=65..310 -->
  <!-- Time axis: 0-65s, 1s = 10.6px, x(t) = 70 + t*10.6 -->
  <!-- Pressure: 0-10 bar, 1bar = 24.5px, y(p) = 310 - p*24.5 -->

  <!-- Grid -->
  <g stroke="#333" stroke-width="0.5" stroke-dasharray="3,6">
    <line x1="70" y1="285.5" x2="760" y2="285.5"/>
    <line x1="70" y1="261" x2="760" y2="261"/>
    <line x1="70" y1="236.5" x2="760" y2="236.5"/>
    <line x1="70" y1="212" x2="760" y2="212"/>
    <line x1="70" y1="187.5" x2="760" y2="187.5"/>
    <line x1="70" y1="163" x2="760" y2="163"/>
    <line x1="70" y1="138.5" x2="760" y2="138.5"/>
    <line x1="70" y1="114" x2="760" y2="114"/>
    <line x1="70" y1="89.5" x2="760" y2="89.5"/>
    <!-- Vertical: every 10s -->
    <line x1="176" y1="65" x2="176" y2="310"/>
    <line x1="282" y1="65" x2="282" y2="310"/>
    <line x1="388" y1="65" x2="388" y2="310"/>
    <line x1="494" y1="65" x2="494" y2="310"/>
    <line x1="600" y1="65" x2="600" y2="310"/>
    <line x1="706" y1="65" x2="706" y2="310"/>
  </g>
  <line x1="70" y1="310" x2="760" y2="310" stroke="#555" stroke-width="1"/>
  <line x1="70" y1="65" x2="70" y2="310" stroke="#555" stroke-width="1"/>

  <!-- Axis labels -->
  <text x="35" y="93" text-anchor="middle" fill="#aaa" font-size="9">9</text>
  <text x="35" y="142" text-anchor="middle" fill="#aaa" font-size="9">7</text>
  <text x="35" y="191" text-anchor="middle" fill="#aaa" font-size="9">5</text>
  <text x="35" y="240" text-anchor="middle" fill="#aaa" font-size="9">3</text>
  <text x="35" y="289" text-anchor="middle" fill="#aaa" font-size="9">1</text>
  <text x="35" y="314" text-anchor="middle" fill="#aaa" font-size="9">0</text>

  <text x="70" y="328" text-anchor="middle" fill="#aaa" font-size="9">0s</text>
  <text x="176" y="328" text-anchor="middle" fill="#aaa" font-size="9">10</text>
  <text x="282" y="328" text-anchor="middle" fill="#aaa" font-size="9">20</text>
  <text x="388" y="328" text-anchor="middle" fill="#aaa" font-size="9">30</text>
  <text x="494" y="328" text-anchor="middle" fill="#aaa" font-size="9">40</text>
  <text x="600" y="328" text-anchor="middle" fill="#aaa" font-size="9">50</text>
  <text x="706" y="328" text-anchor="middle" fill="#aaa" font-size="9">60</text>

  <text x="15" y="190" text-anchor="middle" fill="#ccc" font-size="10" transform="rotate(-90,15,190)">Pressure (bar)</text>
  <text x="415" y="345" text-anchor="middle" fill="#ccc" font-size="10">Time (seconds)</text>

  <!-- Phase dividers -->
  <line x1="155" y1="65" x2="155" y2="310" stroke="#00d4ff" stroke-width="0.5" stroke-dasharray="4,4" opacity="0.4"/>
  <line x1="473" y1="65" x2="473" y2="310" stroke="#00d4ff" stroke-width="0.5" stroke-dasharray="4,4" opacity="0.4"/>
  <line x1="526" y1="65" x2="526" y2="310" stroke="#00d4ff" stroke-width="0.5" stroke-dasharray="4,4" opacity="0.4"/>

  <!-- Phase labels -->
  <text x="113" y="80" text-anchor="middle" fill="#00d4ff" font-size="8" opacity="0.7">Preinfusion</text>
  <text x="314" y="80" text-anchor="middle" fill="#00d4ff" font-size="8" opacity="0.7">BLOOM (pump off - 30s)</text>
  <text x="500" y="80" text-anchor="middle" fill="#00d4ff" font-size="8" opacity="0.7">Ramp</text>
  <text x="643" y="80" text-anchor="middle" fill="#00d4ff" font-size="8" opacity="0.7">Extraction</text>

  <!-- Bloom zone highlight -->
  <rect x="155" y="65" width="318" height="245" fill="#00d4ff" opacity="0.04" rx="4"/>
  <text x="314" y="260" text-anchor="middle" fill="#00d4ff" font-size="20" opacity="0.15" font-weight="bold">CO₂ DEGAS</text>

  <!-- Pressure fill area -->
  <polygon points="70,310 155,138.5 200,160 300,285 400,298 473,298 526,298 526,163 600,138.5 706,138.5 760,145 760,310"
    fill="url(#pressureFill)"/>

  <!-- Pressure curve (cyan) -->
  <!-- Ph1: 0→7bar in ~8s (4ml/s flow, INSTANT, 7bar cap) -->
  <!-- Ph2: 7→~0.5bar over 30s (pump off, natural decay) -->
  <!-- Ph3: 0→~7bar over 5s (ramp, EASE_OUT) -->
  <!-- Ph4: ~7-8bar steady (2ml/s flow, 9bar cap) -->
  <polyline points="70,310 155,138.5 200,170 260,248 340,290 420,297 473,298 526,163 570,140 620,138 706,138 760,145"
    fill="none" stroke="#00d4ff" stroke-width="2.5"/>

  <!-- Key value annotations -->
  <text x="160" y="130" text-anchor="start" fill="#00d4ff" font-size="9" font-weight="bold">7 bar cap</text>
  <text x="473" y="305" text-anchor="end" fill="#888" font-size="8">~0.5 bar</text>
  <text x="600" y="130" text-anchor="middle" fill="#00d4ff" font-size="9" font-weight="bold">~7 bar</text>

  <!-- Flow indicator (dashed) -->
  <!-- Ph1: 4ml/s, Ph2: 0ml/s, Ph3: ramp to 2ml/s, Ph4: 2ml/s -->
  <!-- Flow scale: 0-5 ml/s mapped to y=310..y=187.5 (same chart, right axis) -->
  <polyline points="70,310 85,249 155,249 155,310 473,310 526,279.5 570,279.5 706,279.5 760,279.5"
    fill="none" stroke="#ff7043" stroke-width="1.5" stroke-dasharray="6,3" opacity="0.6"/>

  <!-- Right axis label for flow -->
  <text x="780" y="283" text-anchor="start" fill="#ff7043" font-size="8" opacity="0.7">2 ml/s</text>
  <text x="780" y="253" text-anchor="start" fill="#ff7043" font-size="8" opacity="0.7">4 ml/s</text>
  <text x="780" y="314" text-anchor="start" fill="#ff7043" font-size="8" opacity="0.7">0</text>

  <!-- Phase detail boxes -->
  <rect x="70" y="352" width="120" height="38" rx="4" fill="#222" stroke="#444" stroke-width="0.5"/>
  <text x="130" y="366" text-anchor="middle" fill="#00d4ff" font-size="9" font-weight="bold">PI: 4 ml/s flow</text>
  <text x="130" y="380" text-anchor="middle" fill="#888" font-size="8">7 bar cap · ≤8s</text>

  <rect x="200" y="352" width="180" height="38" rx="4" fill="#222" stroke="#00d4ff" stroke-width="1" opacity="0.8"/>
  <text x="290" y="366" text-anchor="middle" fill="#00d4ff" font-size="9" font-weight="bold">BLOOM: 0 flow for 30s</text>
  <text x="290" y="380" text-anchor="middle" fill="#888" font-size="8">until &lt;0.6 bar OR 5g drip</text>

  <rect x="390" y="352" width="110" height="38" rx="4" fill="#222" stroke="#444" stroke-width="0.5"/>
  <text x="445" y="366" text-anchor="middle" fill="#00d4ff" font-size="9" font-weight="bold">Ramp: 0→2 ml/s</text>
  <text x="445" y="380" text-anchor="middle" fill="#888" font-size="8">EASE_OUT · 5s</text>

  <rect x="510" y="352" width="230" height="38" rx="4" fill="#222" stroke="#444" stroke-width="0.5"/>
  <text x="625" y="366" text-anchor="middle" fill="#00d4ff" font-size="9" font-weight="bold">Extract: 2 ml/s steady · 9 bar cap</text>
  <text x="625" y="380" text-anchor="middle" fill="#888" font-size="8">runs until 36g stop-on-weight</text>
</svg>
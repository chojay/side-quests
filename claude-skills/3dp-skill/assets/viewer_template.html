<!DOCTYPE html>
<html><head><title>{{TITLE}} - 3D Viewer</title>
<style>
body { margin:0; overflow:hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
#info { position:absolute; top:10px; left:10px; background:rgba(0,0,0,0.75);
         color:white; padding:15px 20px; border-radius:8px; max-width:320px; }
#info h2 { margin:0 0 8px 0; font-size:16px; }
#info p { margin:4px 0; font-size:13px; opacity:0.9; }
#controls { position:absolute; bottom:10px; left:10px; background:rgba(0,0,0,0.6);
            color:white; padding:8px 14px; border-radius:5px; font-size:12px; opacity:0.8; }
</style></head>
<body>
<div id="info">
  <h2>{{TITLE}}</h2>
  <p>{{DIMENSIONS}}</p>
  <p>{{INFO}}</p>
</div>
<div id="controls">Left drag: Rotate | Right drag: Pan | Scroll: Zoom</div>
<script type="importmap">{
"imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}
}</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf0f0f0);
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 10000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

// Lighting
scene.add(new THREE.AmbientLight(0x404040, 2));
const light1 = new THREE.DirectionalLight(0xffffff, 1);
light1.position.set(100, 100, 50);
light1.castShadow = true;
scene.add(light1);
const light2 = new THREE.DirectionalLight(0xffffff, 0.5);
light2.position.set(-50, -50, 100);
scene.add(light2);

// Grid and axes
scene.add(new THREE.GridHelper(200, 20, 0x888888, 0xcccccc));
scene.add(new THREE.AxesHelper(100));

// Controls
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

// Load embedded STL
const loader = new STLLoader();
const stlData = atob('{{STL_BASE64}}');
const stlArray = new Uint8Array(stlData.length);
for (let i = 0; i < stlData.length; i++) stlArray[i] = stlData.charCodeAt(i);
const geometry = loader.parse(stlArray.buffer);
geometry.center();
const material = new THREE.MeshPhongMaterial({
    color: {{COLOR}},
    specular: 0x111111,
    shininess: 200
});
const mesh = new THREE.Mesh(geometry, material);
scene.add(mesh);

// Auto-fit camera
const box = new THREE.Box3().setFromObject(mesh);
const size = box.getSize(new THREE.Vector3());
const maxDim = Math.max(size.x, size.y, size.z);
const fov = camera.fov * (Math.PI / 180);
let cameraZ = Math.abs(maxDim / 2 / Math.tan(fov / 2)) * 2;
camera.position.set(cameraZ, cameraZ, cameraZ);
camera.lookAt(0, 0, 0);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
animate();
</script></body></html>

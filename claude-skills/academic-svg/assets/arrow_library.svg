<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900">

  <title>Arrow Style Library for Academic Figures</title>

  <defs>
    <!-- Standard arrowhead -->
    <marker id="arrow1" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#2E2E2E"/>
    </marker>

    <!-- Bold arrowhead -->
    <marker id="arrow2" markerWidth="14" markerHeight="14" refX="13" refY="5" orient="auto">
      <polygon points="0 0, 14 5, 0 10" fill="#2E2E2E"/>
    </marker>

    <!-- Colored ion arrow -->
    <marker id="arrow3" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#4EC9E0"/>
    </marker>

    <!-- Red warning arrow -->
    <marker id="arrow4" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#E83845"/>
    </marker>

    <!-- Double-sided marker (for start) -->
    <marker id="doubleStart" markerWidth="10" markerHeight="10" refX="1" refY="3" orient="auto">
      <polygon points="10 0, 0 3, 10 6" fill="#2E2E2E"/>
    </marker>

    <!-- Hollow arrowhead -->
    <marker id="arrowHollow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#FFFFFF" stroke="#2E2E2E" stroke-width="0.8"/>
    </marker>

    <!-- Wide arrowhead -->
    <marker id="arrowWide" markerWidth="12" markerHeight="14" refX="11" refY="7" orient="auto">
      <polygon points="0 0, 12 7, 0 14" fill="#2E2E2E"/>
    </marker>
  </defs>

  <style>
    .section-title {
      font-family: -apple-system, sans-serif;
      font-size: 16px;
      font-weight: 700;
      fill: #2E2E2E;
    }
    .arrow-label {
      font-family: -apple-system, sans-serif;
      font-size: 11px;
      font-weight: 600;
      fill: #2E2E2E;
    }
    .arrow-desc {
      font-family: -apple-system, sans-serif;
      font-size: 9px;
      fill: #606060;
    }
    .code-text {
      font-family: monospace;
      font-size: 8px;
      fill: #808080;
    }
  </style>

  <!-- Background -->
  <rect width="800" height="900" fill="#FAFAFA"/>

  <!-- Title -->
  <text x="400" y="30" font-size="20" font-weight="700" fill="#2E2E2E" text-anchor="middle">Arrow Style Library</text>

  <!-- ========== BASIC ARROWS ========== -->
  <g id="basic-arrows" transform="translate(50, 60)">
    <text x="0" y="0" class="section-title">Basic Arrows</text>

    <!-- 1. Standard arrow -->
    <line x1="0" y1="40" x2="200" y2="40" stroke="#2E2E2E" stroke-width="2" marker-end="url(#arrow1)"/>
    <text x="210" y="37" class="arrow-label">Standard Arrow</text>
    <text x="210" y="48" class="arrow-desc">General purpose, 2px width</text>
    <text x="210" y="58" class="code-text">stroke-width="2" marker-end="url(#arrow)"</text>

    <!-- 2. Bold arrow -->
    <line x1="0" y1="100" x2="200" y2="100" stroke="#2E2E2E" stroke-width="4" marker-end="url(#arrow2)"/>
    <text x="210" y="97" class="arrow-label">Bold Process Arrow</text>
    <text x="210" y="108" class="arrow-desc">Major processes, 4px width</text>
    <text x="210" y="118" class="code-text">stroke-width="4" marker-end="url(#boldArrow)"</text>

    <!-- 3. Thin arrow -->
    <line x1="0" y1="160" x2="200" y2="160" stroke="#2E2E2E" stroke-width="1.5" marker-end="url(#arrow1)"/>
    <text x="210" y="157" class="arrow-label">Thin Arrow</text>
    <text x="210" y="168" class="arrow-desc">Subtle connections, 1.5px width</text>
    <text x="210" y="178" class="code-text">stroke-width="1.5"</text>
  </g>

  <!-- ========== COLORED ARROWS ========== -->
  <g id="colored-arrows" transform="translate(50, 280)">
    <text x="0" y="0" class="section-title">Colored Arrows</text>

    <!-- 1. Ion movement (cyan) -->
    <line x1="0" y1="40" x2="200" y2="40" stroke="#4EC9E0" stroke-width="2" marker-end="url(#arrow3)"/>
    <text x="210" y="37" class="arrow-label">Ion Movement (Cyan)</text>
    <text x="210" y="48" class="arrow-desc">Plasma ions (Ar⁺), implanted species</text>
    <text x="210" y="58" class="code-text">stroke="#4EC9E0"</text>

    <!-- 2. Electron transfer (blue) -->
    <line x1="0" y1="100" x2="200" y2="100" stroke="#4472C4" stroke-width="2" marker-end="url(#arrow1)"/>
    <text x="210" y="97" class="arrow-label">Electron Transfer (Blue)</text>
    <text x="210" y="108" class="arrow-desc">For e⁻ movement</text>
    <text x="210" y="118" class="code-text">stroke="#4472C4"</text>

    <!-- 3. Warning/failure (red) -->
    <line x1="0" y1="160" x2="200" y2="160" stroke="#E83845" stroke-width="2.5" marker-end="url(#arrow4)"/>
    <text x="210" y="157" class="arrow-label">Warning/Failure (Red)</text>
    <text x="210" y="168" class="arrow-desc">Critical points, failures</text>
    <text x="210" y="178" class="code-text">stroke="#E83845"</text>
  </g>

  <!-- ========== DASHED ARROWS ========== -->
  <g id="dashed-arrows" transform="translate(50, 500)">
    <text x="0" y="0" class="section-title">Dashed &amp; Patterned Arrows</text>

    <!-- 1. Dashed -->
    <line x1="0" y1="40" x2="200" y2="40" stroke="#2E2E2E" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow1)"/>
    <text x="210" y="37" class="arrow-label">Dashed Arrow</text>
    <text x="210" y="48" class="arrow-desc">Conceptual relationships</text>
    <text x="210" y="58" class="code-text">stroke-dasharray="5,5"</text>

    <!-- 2. Dotted -->
    <line x1="0" y1="100" x2="200" y2="100" stroke="#2E2E2E" stroke-width="2" stroke-dasharray="2,3" marker-end="url(#arrow1)"/>
    <text x="210" y="97" class="arrow-label">Dotted Arrow</text>
    <text x="210" y="108" class="arrow-desc">Weak or hypothetical connections</text>
    <text x="210" y="118" class="code-text">stroke-dasharray="2,3"</text>

    <!-- 3. Dash-dot -->
    <line x1="0" y1="160" x2="200" y2="160" stroke="#4472C4" stroke-width="2" stroke-dasharray="8,3,2,3" marker-end="url(#arrow3)"/>
    <text x="210" y="157" class="arrow-label">Dash-Dot Arrow</text>
    <text x="210" y="168" class="arrow-desc">Special processes</text>
    <text x="210" y="178" class="code-text">stroke-dasharray="8,3,2,3"</text>
  </g>

  <!-- ========== DOUBLE-ENDED ARROWS ========== -->
  <g id="double-arrows" transform="translate(50, 720)">
    <text x="0" y="0" class="section-title">Double-Ended Arrows</text>

    <!-- 1. Bidirectional -->
    <line x1="0" y1="40" x2="200" y2="40" stroke="#2E2E2E" stroke-width="2" marker-start="url(#doubleStart)" marker-end="url(#arrow1)"/>
    <text x="210" y="37" class="arrow-label">Bidirectional Arrow</text>
    <text x="210" y="48" class="arrow-desc">Equilibrium, reversible processes</text>
    <text x="210" y="58" class="code-text">marker-start="..." marker-end="..."</text>

    <!-- 2. Hollow bidirectional -->
    <line x1="0" y1="100" x2="200" y2="100" stroke="#4472C4" stroke-width="2" marker-start="url(#arrowHollow)" marker-end="url(#arrowHollow)"/>
    <text x="210" y="97" class="arrow-label">Hollow Bidirectional</text>
    <text x="210" y="108" class="arrow-desc">Alternative style</text>
  </g>

  <!-- ========== CURVED ARROWS ========== -->
  <g id="curved-arrows" transform="translate(450, 60)">
    <text x="0" y="0" class="section-title">Curved Arrows</text>

    <!-- 1. Smooth curve -->
    <path d="M 0,40 Q 100,20 200,40" fill="none" stroke="#2E2E2E" stroke-width="2" marker-end="url(#arrow1)"/>
    <text x="210" y="37" class="arrow-label">Curved Arrow (Up)</text>
    <text x="210" y="48" class="arrow-desc">Feedback loops, cycles</text>
    <text x="210" y="58" class="code-text">d="M ... Q ..." (quadratic Bézier)</text>

    <!-- 2. Downward curve -->
    <path d="M 0,120 Q 100,140 200,120" fill="none" stroke="#4EC9E0" stroke-width="2.5" marker-end="url(#arrow3)"/>
    <text x="210" y="117" class="arrow-label">Curved Arrow (Down)</text>
    <text x="210" y="128" class="arrow-desc">Return paths</text>

    <!-- 3. S-curve -->
    <path d="M 0,200 C 50,180 150,220 200,200" fill="none" stroke="#4472C4" stroke-width="2" marker-end="url(#arrow1)"/>
    <text x="210" y="197" class="arrow-label">S-Curve Arrow</text>
    <text x="210" y="208" class="arrow-desc">Complex pathways</text>
    <text x="210" y="218" class="code-text">d="M ... C ..." (cubic Bézier)</text>
  </g>

  <!-- ========== WIDE/THICK ARROWS ========== -->
  <g id="thick-arrows" transform="translate(450, 300)">
    <text x="0" y="0" class="section-title">Thick &amp; Wide Arrows</text>

    <!-- 1. Very thick -->
    <line x1="0" y1="40" x2="200" y2="40" stroke="#2E2E2E" stroke-width="6" marker-end="url(#arrow2)"/>
    <text x="210" y="37" class="arrow-label">Very Thick Arrow</text>
    <text x="210" y="48" class="arrow-desc">Dominant process, 6px width</text>
    <text x="210" y="58" class="code-text">stroke-width="6"</text>

    <!-- 2. Wide arrowhead -->
    <line x1="0" y1="100" x2="200" y2="100" stroke="#4472C4" stroke-width="3" marker-end="url(#arrowWide)"/>
    <text x="210" y="97" class="arrow-label">Wide Arrowhead</text>
    <text x="210" y="108" class="arrow-desc">Emphasis on direction</text>

    <!-- 3. Tapered arrow (using polygon) -->
    <polygon points="0,170 180,160 180,150 200,165 180,180 180,170" fill="#E83845"/>
    <text x="210" y="162" class="arrow-label">Tapered Arrow</text>
    <text x="210" y="173" class="arrow-desc">Strong visual weight</text>
    <text x="210" y="183" class="code-text">&lt;polygon&gt; element</text>
  </g>

  <!-- ========== SPECIALTY ARROWS ========== -->
  <g id="specialty-arrows" transform="translate(450, 540)">
    <text x="0" y="0" class="section-title">Specialty Arrows</text>

    <!-- 1. Multiple parallel arrows -->
    <g>
      <line x1="0" y1="35" x2="180" y2="35" stroke="#4EC9E0" stroke-width="1.5" marker-end="url(#arrow3)"/>
      <line x1="0" y1="42" x2="180" y2="42" stroke="#4EC9E0" stroke-width="1.5" marker-end="url(#arrow3)"/>
      <line x1="0" y1="49" x2="180" y2="49" stroke="#4EC9E0" stroke-width="1.5" marker-end="url(#arrow3)"/>
      <text x="190" y="37" class="arrow-label">Parallel Arrows</text>
      <text x="190" y="48" class="arrow-desc">Multiple ions/species</text>
    </g>

    <!-- 2. Offset parallel (flux) -->
    <g transform="translate(0, 75)">
      <line x1="10" y1="35" x2="180" y2="35" stroke="#4472C4" stroke-width="1.5" marker-end="url(#arrow1)"/>
      <line x1="0" y1="42" x2="170" y2="42" stroke="#4472C4" stroke-width="1.5" marker-end="url(#arrow1)"/>
      <line x1="20" y1="49" x2="190" y2="49" stroke="#4472C4" stroke-width="1.5" marker-end="url(#arrow1)"/>
      <text x="200" y="37" class="arrow-label">Flux Arrows</text>
      <text x="200" y="48" class="arrow-desc">Flow field representation</text>
    </g>

    <!-- 3. Circular arrow (cycle) -->
    <path d="M 100,180 A 30,30 0 1,1 99,180" fill="none" stroke="#2E2E2E" stroke-width="2" marker-end="url(#arrow1)"/>
    <text x="140" y="177" class="arrow-label">Circular Arrow</text>
    <text x="140" y="188" class="arrow-desc">Cyclic processes</text>
    <text x="140" y="198" class="code-text">A (arc) path command</text>
  </g>

  <!-- Usage notes -->
  <g id="usage-notes" transform="translate(50, 850)">
    <text x="0" y="0" font-size="11" font-weight="600" fill="#2E2E2E">Usage Notes:</text>
    <text x="0" y="15" font-size="9" fill="#606060">• Arrow width should match importance (1.5-2px standard, 3-6px for major processes)</text>
    <text x="0" y="28" font-size="9" fill="#606060">• Use color semantically (cyan for ions, blue for electrons, red for failures)</text>
    <text x="0" y="41" font-size="9" fill="#606060">• Dashed arrows indicate conceptual or weak relationships</text>
  </g>

</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900">

  <title>Typography Samples for Academic Figures</title>

  <style>
    .section-title {
      font-family: -apple-system, sans-serif;
      font-size: 16px;
      font-weight: 700;
      fill: #2E2E2E;
    }
    .sample-label {
      font-family: -apple-system, sans-serif;
      font-size: 10px;
      fill: #606060;
    }
    .code-text {
      font-family: monospace;
      font-size: 8px;
      fill: #808080;
    }
  </style>

  <!-- Background -->
  <rect width="800" height="900" fill="#FAFAFA"/>

  <!-- Title -->
  <text x="400" y="30" font-size="20" font-weight="700" fill="#2E2E2E" text-anchor="middle">Typography Samples</text>
  <text x="400" y="50" font-size="11" fill="#606060" text-anchor="middle">Font sizes and styles for academic SVG figures</text>

  <!-- ========== FONT SIZES ========== -->
  <g id="font-sizes" transform="translate(50, 80)">
    <text x="0" y="0" class="section-title">Font Size Hierarchy</text>
    <line x1="0" y1="5" x2="700" y2="5" stroke="#D3D3D3" stroke-width="0.5"/>

    <!-- Figure Title (18-20px) -->
    <g transform="translate(0, 30)">
      <text x="0" y="0" font-family="-apple-system, sans-serif" font-size="20" font-weight="700" fill="#2E2E2E">Figure Title</text>
      <text x="200" y="0" class="sample-label">18-20px, Bold (700)</text>
      <text x="200" y="12" class="code-text">font-size="20" font-weight="700"</text>
    </g>

    <!-- Panel Labels (14-16px) -->
    <g transform="translate(0, 70)">
      <text x="0" y="0" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#2E2E2E">a</text>
      <text x="30" y="0" class="sample-label">Panel Label: 14-16px, Bold (700)</text>
      <text x="30" y="12" class="code-text">font-size="16" font-weight="700"</text>
    </g>

    <!-- Main Labels (11-12px) -->
    <g transform="translate(0, 105)">
      <text x="0" y="0" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#2E2E2E">Material Label</text>
      <text x="150" y="0" class="sample-label">Main Labels: 11-12px, Semi-bold (600)</text>
      <text x="150" y="12" class="code-text">font-size="12" font-weight="600"</text>
    </g>

    <!-- Axis Labels (9-10px) -->
    <g transform="translate(0, 140)">
      <text x="0" y="0" font-family="-apple-system, sans-serif" font-size="10" font-weight="400" fill="#2E2E2E">Axis Label (units)</text>
      <text x="150" y="0" class="sample-label">Axis Labels: 9-10px, Regular (400)</text>
      <text x="150" y="12" class="code-text">font-size="10" font-weight="400"</text>
    </g>

    <!-- Annotations (8-9px) -->
    <g transform="translate(0, 175)">
      <text x="0" y="0" font-family="-apple-system, sans-serif" font-size="9" font-weight="400" fill="#606060">Annotation text</text>
      <text x="150" y="0" class="sample-label">Annotations: 8-9px, Regular (400)</text>
      <text x="150" y="12" class="code-text">font-size="9" font-weight="400"</text>
    </g>

    <!-- Tick Labels (8-9px) -->
    <g transform="translate(0, 210)">
      <text x="0" y="0" font-family="-apple-system, sans-serif" font-size="8" font-weight="400" fill="#606060">100</text>
      <text x="50" y="0" class="sample-label">Tick Labels: 8-9px, Regular (400)</text>
      <text x="50" y="12" class="code-text">font-size="8" font-weight="400"</text>
    </g>

  </g>

  <!-- ========== CHEMICAL NOTATION ========== -->
  <g id="chemical-notation" transform="translate(50, 350)">
    <text x="0" y="0" class="section-title">Chemical Notation</text>
    <line x1="0" y1="5" x2="700" y2="5" stroke="#D3D3D3" stroke-width="0.5"/>

    <!-- Subscripts -->
    <g transform="translate(0, 30)">
      <text x="0" y="0" font-family="-apple-system, sans-serif" font-size="12" fill="#2E2E2E">
        H<tspan baseline-shift="sub" font-size="8.4">2</tspan>O
      </text>
      <text x="60" y="0" class="sample-label">Subscripts: 70% of base size</text>
      <text x="60" y="12" class="code-text">&lt;tspan baseline-shift="sub" font-size="0.7em"&gt;2&lt;/tspan&gt;</text>
    </g>

    <g transform="translate(0, 65)">
      <text x="0" y="0" font-family="-apple-system, sans-serif" font-size="12" fill="#2E2E2E">
        Si<tspan baseline-shift="sub" font-size="8.4">3</tspan>N<tspan baseline-shift="sub" font-size="8.4">4</tspan>
      </text>
      <text x="80" y="0" class="sample-label">Multiple subscripts</text>
    </g>

    <!-- Superscripts -->
    <g transform="translate(0, 100)">
      <text x="0" y="0" font-family="-apple-system, sans-serif" font-size="12" fill="#2E2E2E">
        Ar<tspan baseline-shift="super" font-size="8.4">+</tspan>
      </text>
      <text x="60" y="0" class="sample-label">Superscripts: 70% of base size</text>
      <text x="60" y="12" class="code-text">&lt;tspan baseline-shift="super" font-size="0.7em"&gt;+&lt;/tspan&gt;</text>
    </g>

    <g transform="translate(0, 135)">
      <text x="0" y="0" font-family="-apple-system, sans-serif" font-size="12" fill="#2E2E2E">
        10<tspan baseline-shift="super" font-size="8.4">16</tspan> cm<tspan baseline-shift="super" font-size="8.4">-3</tspan>
      </text>
      <text x="80" y="0" class="sample-label">Scientific notation (dopant concentration)</text>
    </g>

    <!-- Italics for variables -->
    <g transform="translate(0, 170)">
      <text x="0" y="0" font-family="-apple-system, sans-serif" font-size="12" fill="#2E2E2E">
        <tspan font-style="italic">E</tspan><tspan baseline-shift="sub" font-size="8.4">f</tspan> = 4.5 eV
      </text>
      <text x="120" y="0" class="sample-label">Variables in italics (not chemical symbols)</text>
      <text x="120" y="12" class="code-text">font-style="italic" for variables only</text>
    </g>

    <!-- Greek letters -->
    <g transform="translate(0, 210)">
      <text x="0" y="0" font-family="-apple-system, sans-serif" font-size="12" fill="#2E2E2E">α-phase, β-transition, ΔG</text>
      <text x="200" y="0" class="sample-label">Greek letters: Unicode characters</text>
      <text x="200" y="12" class="code-text">α (U+03B1), β (U+03B2), Δ (U+0394)</text>
    </g>
  </g>

  <!-- ========== TEXT ALIGNMENT ========== -->
  <g id="text-alignment" transform="translate(50, 640)">
    <text x="0" y="0" class="section-title">Text Alignment</text>
    <line x1="0" y1="5" x2="700" y2="5" stroke="#D3D3D3" stroke-width="0.5"/>

    <!-- Center line for reference -->
    <line x1="200" y1="30" x2="200" y2="110" stroke="#4EC9E0" stroke-width="0.5" stroke-dasharray="2,2"/>
    <text x="200" y="25" font-size="8" fill="#4EC9E0" text-anchor="middle">reference line</text>

    <!-- Left aligned -->
    <g transform="translate(0, 45)">
      <text x="200" y="0" font-family="-apple-system, sans-serif" font-size="11" fill="#2E2E2E" text-anchor="start">Left aligned (start)</text>
      <text x="350" y="0" class="code-text">text-anchor="start"</text>
    </g>

    <!-- Center aligned -->
    <g transform="translate(0, 70)">
      <text x="200" y="0" font-family="-apple-system, sans-serif" font-size="11" fill="#2E2E2E" text-anchor="middle">Center aligned</text>
      <text x="350" y="0" class="code-text">text-anchor="middle"</text>
    </g>

    <!-- Right aligned -->
    <g transform="translate(0, 95)">
      <text x="200" y="0" font-family="-apple-system, sans-serif" font-size="11" fill="#2E2E2E" text-anchor="end">Right aligned (end)</text>
      <text x="350" y="0" class="code-text">text-anchor="end"</text>
    </g>
  </g>

  <!-- ========== TEXT COLORS ========== -->
  <g id="text-colors" transform="translate(50, 780)">
    <text x="0" y="0" class="section-title">Text Colors</text>
    <line x1="0" y1="5" x2="700" y2="5" stroke="#D3D3D3" stroke-width="0.5"/>

    <!-- Primary text -->
    <g transform="translate(0, 30)">
      <text x="0" y="0" font-family="-apple-system, sans-serif" font-size="12" fill="#2E2E2E">Primary text color</text>
      <text x="200" y="0" class="sample-label">#2E2E2E (not pure black)</text>
    </g>

    <!-- Secondary text -->
    <g transform="translate(0, 55)">
      <text x="0" y="0" font-family="-apple-system, sans-serif" font-size="12" fill="#606060">Secondary text color</text>
      <text x="200" y="0" class="sample-label">#606060 (medium gray)</text>
    </g>

    <!-- Tertiary text -->
    <g transform="translate(0, 80)">
      <text x="0" y="0" font-family="-apple-system, sans-serif" font-size="12" fill="#808080">Tertiary text color</text>
      <text x="200" y="0" class="sample-label">#808080 (light gray)</text>
    </g>
  </g>

  <!-- Footer note -->
  <text x="400" y="880" font-size="9" fill="#808080" text-anchor="middle">
    Academic SVG Skill • Typography standards for publication-quality figures
  </text>

</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" role="img" aria-labelledby="title desc">

  <!-- ========================================
       MULTI-PANEL TEMPLATE
       For creating figures with multiple panels (a, b, c, d)
       ======================================== -->

  <title id="title">Multi-panel figure template</title>
  <desc id="desc">Template for creating academic figures with multiple panels arranged in a grid layout</desc>

  <!-- ========================================
       DEFINITIONS
       ======================================== -->
  <defs>

    <!-- Standard arrowhead -->
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#2E2E2E"/>
    </marker>

    <!-- Metal gate/contact gradient -->
    <linearGradient id="metalGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD966"/>
      <stop offset="100%" style="stop-color:#F4C542"/>
    </linearGradient>

    <!-- Oxide dielectric gradient -->
    <linearGradient id="oxideGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#B4D7EC"/>
      <stop offset="100%" style="stop-color:#7CB5E8"/>
    </linearGradient>

  </defs>

  <!-- ========================================
       STYLES
       ======================================== -->
  <style>
    /* Panel styles */
    .panel-label {
      font-family: -apple-system, sans-serif;
      font-size: 16px;
      font-weight: 700;
      fill: #2E2E2E;
    }

    .panel-bg {
      fill: #FFF9E6;
      stroke: #D3D3D3;
      stroke-width: 0.5;
    }

    /* Text styles */
    .main-label {
      font-family: -apple-system, sans-serif;
      font-size: 12px;
      font-weight: 600;
      fill: #2E2E2E;
    }

    .annotation {
      font-family: -apple-system, sans-serif;
      font-size: 9px;
      font-weight: 400;
      fill: #606060;
    }

    /* Shape styles */
    .layer-outline {
      stroke: #2E2E2E;
      stroke-width: 1;
    }
  </style>

  <!-- ========================================
       BACKGROUND
       ======================================== -->
  <rect width="900" height="900" fill="#FAFAFA"/>

  <!-- Optional: Overall figure title -->
  <text x="450" y="30" class="main-label" text-anchor="middle" font-size="14">Figure Title (Optional)</text>

  <!-- ========================================
       PANEL A (Top-Left)
       ======================================== -->
  <g id="panel-a" transform="translate(50, 60)">

    <!-- Panel label -->
    <text x="10" y="20" class="panel-label">a</text>

    <!-- Panel background (optional) -->
    <!-- <rect x="0" y="0" width="400" height="400" class="panel-bg" rx="5"/> -->

    <!-- Panel content area -->
    <g id="panel-a-content" transform="translate(20, 40)">
      <!-- Add your panel A content here -->

      <!-- Example placeholder -->
      <rect x="50" y="50" width="300" height="250" fill="#7CB5E8" class="layer-outline"/>
      <text x="200" y="180" class="main-label" text-anchor="middle">Panel A Content</text>
      <text x="200" y="195" class="annotation" text-anchor="middle">Replace with your content</text>
    </g>

    <!-- Panel caption (optional) -->
    <text x="200" y="385" class="annotation" text-anchor="middle">Panel A description</text>

  </g>

  <!-- ========================================
       PANEL B (Top-Right)
       ======================================== -->
  <g id="panel-b" transform="translate(470, 60)">

    <!-- Panel label -->
    <text x="10" y="20" class="panel-label">b</text>

    <!-- Panel content area -->
    <g id="panel-b-content" transform="translate(20, 40)">
      <!-- Add your panel B content here -->

      <!-- Example placeholder -->
      <rect x="50" y="50" width="300" height="250" fill="#F4C542" class="layer-outline"/>
      <text x="200" y="180" class="main-label" text-anchor="middle">Panel B Content</text>
      <text x="200" y="195" class="annotation" text-anchor="middle">Replace with your content</text>
    </g>

    <!-- Panel caption (optional) -->
    <text x="200" y="385" class="annotation" text-anchor="middle">Panel B description</text>

  </g>

  <!-- ========================================
       PANEL C (Bottom-Left)
       ======================================== -->
  <g id="panel-c" transform="translate(50, 480)">

    <!-- Panel label -->
    <text x="10" y="20" class="panel-label">c</text>

    <!-- Panel content area -->
    <g id="panel-c-content" transform="translate(20, 40)">
      <!-- Add your panel C content here -->

      <!-- Example placeholder -->
      <rect x="50" y="50" width="300" height="250" fill="#FFB6C1" class="layer-outline"/>
      <text x="200" y="180" class="main-label" text-anchor="middle">Panel C Content</text>
      <text x="200" y="195" class="annotation" text-anchor="middle">Replace with your content</text>
    </g>

    <!-- Panel caption (optional) -->
    <text x="200" y="385" class="annotation" text-anchor="middle">Panel C description</text>

  </g>

  <!-- ========================================
       PANEL D (Bottom-Right)
       ======================================== -->
  <g id="panel-d" transform="translate(470, 480)">

    <!-- Panel label -->
    <text x="10" y="20" class="panel-label">d</text>

    <!-- Panel content area -->
    <g id="panel-d-content" transform="translate(20, 40)">
      <!-- Add your panel D content here -->

      <!-- Example placeholder -->
      <rect x="50" y="50" width="300" height="250" fill="#8FBC8F" class="layer-outline"/>
      <text x="200" y="180" class="main-label" text-anchor="middle">Panel D Content</text>
      <text x="200" y="195" class="annotation" text-anchor="middle">Replace with your content</text>
    </g>

    <!-- Panel caption (optional) -->
    <text x="200" y="385" class="annotation" text-anchor="middle">Panel D description</text>

  </g>

  <!-- ========================================
       LAYOUT GUIDE (Remove in final version)
       ======================================== -->
  <g id="layout-guide" opacity="0.3">
    <!-- Panel boundaries (dashed lines) -->
    <rect x="50" y="60" width="400" height="400" fill="none" stroke="#FF0000" stroke-width="0.5" stroke-dasharray="3,3"/>
    <rect x="470" y="60" width="400" height="400" fill="none" stroke="#FF0000" stroke-width="0.5" stroke-dasharray="3,3"/>
    <rect x="50" y="480" width="400" height="400" fill="none" stroke="#FF0000" stroke-width="0.5" stroke-dasharray="3,3"/>
    <rect x="470" y="480" width="400" height="400" fill="none" stroke="#FF0000" stroke-width="0.5" stroke-dasharray="3,3"/>

    <!-- Center guidelines -->
    <line x1="450" y1="0" x2="450" y2="900" stroke="#FF0000" stroke-width="0.5" stroke-dasharray="2,2"/>
    <line x1="0" y1="460" x2="900" y2="460" stroke="#FF0000" stroke-width="0.5" stroke-dasharray="2,2"/>

    <!-- Dimension annotations -->
    <text x="250" y="50" font-size="8" fill="#FF0000">400px width</text>
    <text x="40" y="260" font-size="8" fill="#FF0000" transform="rotate(-90 40 260)">400px height</text>
    <text x="460" y="50" font-size="8" fill="#FF0000">20px gutter</text>
  </g>

  <!-- ========================================
       USAGE NOTES
       ======================================== -->
  <!--

  MULTI-PANEL LAYOUT SPECIFICATIONS:

  Panel Dimensions:
  - Each panel: 400×400px
  - Horizontal gutter: 20px
  - Vertical gutter: 20px
  - Panel label position: (10, 20) relative to panel origin

  Grid Layout (2×2):
  - Panel A: (50, 60)
  - Panel B: (470, 60)
  - Panel C: (50, 480)
  - Panel D: (470, 480)

  Customization:
  1. Remove or comment out the layout-guide group
  2. Replace placeholder content in each panel-*-content group
  3. Update panel captions
  4. Adjust overall figure title

  Alternative Layouts:
  - For 1×2 (side-by-side): Use only panels A and B, adjust viewBox to "0 0 900 500"
  - For 1×3 (horizontal row): Add panel E at (890, 60), viewBox "0 0 1330 500"
  - For 2×3 (six panels): Add panels E and F, viewBox "0 0 1330 900"
  - For 3×3 (nine panels): Add panels E-I, viewBox "0 0 1330 1320"

  Panel Content Examples:
  - Layered structures
  - Crystal structures
  - Energy diagrams
  - Process flows
  - Graphs
  - Schematics

  Tips:
  - Keep consistent styling across panels
  - Use same color scheme for related elements
  - Align elements to grid within panels
  - Use annotations to link panels (arrows between panels)

  -->

</svg>

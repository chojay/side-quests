<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" role="img" aria-labelledby="title desc">

  <title id="title">Gate-stack deposition and etch process flow</title>
  <desc id="desc">Sequential process flow diagram showing four stages of gate-stack fabrication on a silicon wafer: surface clean, atomic layer deposition of the high-k dielectric, metal gate deposition, and plasma etch patterning, with arrows indicating progression between stages and a return arrow for the next patterning level</desc>

  <defs>
    <!-- Process arrow marker -->
    <marker id="processArrow" markerWidth="12" markerHeight="12" refX="11" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#2E2E2E"/>
    </marker>

    <!-- Cycle arrow marker (curved) -->
    <marker id="cycleArrow" markerWidth="12" markerHeight="12" refX="11" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#4EC9E0"/>
    </marker>

    <!-- Plasma ion arrow marker -->
    <marker id="plasmaArrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4EC9E0"/>
    </marker>
  </defs>

  <style>
    .panel-label { font-size: 14px; font-weight: 700; fill: #2E2E2E; }
    .stage-title { font-family: -apple-system, sans-serif; font-size: 12px; font-weight: 600; fill: #2E2E2E; }
    .stage-desc { font-family: -apple-system, sans-serif; font-size: 9px; fill: #606060; }
    .process-box { fill: #FFF9E6; stroke: #2E2E2E; stroke-width: 2; }
  </style>

  <!-- Background -->
  <rect width="900" height="350" fill="#FAFAFA"/>

  <!-- Main title -->
  <text x="450" y="30" class="stage-title" text-anchor="middle" font-size="14">Gate-Stack Deposition and Etch Sequence</text>

  <!-- Stage 1: Surface clean -->
  <g id="stage-1" transform="translate(50, 70)">
    <text x="10" y="10" class="panel-label">a</text>
    <rect x="0" y="20" width="140" height="160" rx="5" class="process-box"/>

    <text x="70" y="45" class="stage-title" text-anchor="middle">Surface Clean</text>

    <!-- Bare silicon substrate -->
    <rect x="25" y="130" width="90" height="35" fill="#F2D7A9" stroke="#2E2E2E" stroke-width="0.8"/>
    <text x="70" y="151" font-size="10" text-anchor="middle" font-weight="600">Si</text>

    <!-- Clean surface line -->
    <line x1="25" y1="130" x2="115" y2="130" stroke="#2E2E2E" stroke-width="1.2"/>
    <text x="70" y="122" font-size="8" fill="#606060" text-anchor="middle">H-terminated surface</text>

    <text x="70" y="195" class="stage-desc" text-anchor="middle">HF-last clean,</text>
    <text x="70" y="205" class="stage-desc" text-anchor="middle">(100) surface</text>
  </g>

  <!-- Arrow 1 -->
  <line x1="200" y1="150" x2="250" y2="150" stroke="#2E2E2E" stroke-width="3" marker-end="url(#processArrow)"/>
  <text x="225" y="143" font-size="9" text-anchor="middle">ALD</text>

  <!-- Stage 2: Dielectric deposition -->
  <g id="stage-2" transform="translate(260, 70)">
    <text x="10" y="10" class="panel-label">b</text>
    <rect x="0" y="20" width="140" height="160" rx="5" class="process-box"/>

    <text x="70" y="45" class="stage-title" text-anchor="middle">Dielectric ALD</text>

    <!-- Substrate -->
    <rect x="25" y="130" width="90" height="35" fill="#F2D7A9" stroke="#2E2E2E" stroke-width="0.8"/>
    <text x="70" y="151" font-size="10" text-anchor="middle" font-weight="600">Si</text>

    <!-- Interfacial oxide -->
    <rect x="25" y="122" width="90" height="8" fill="#7CB5E8" stroke="#2E2E2E" stroke-width="0.8"/>

    <!-- High-k layer -->
    <rect x="25" y="108" width="90" height="14" fill="#FFB6C1" stroke="#2E2E2E" stroke-width="0.8"/>
    <text x="70" y="118" font-size="8" text-anchor="middle">HfO&#8322;</text>

    <!-- Precursor pulses -->
    <circle cx="50" cy="85" r="3" fill="#FF69B4" stroke="#2E2E2E" stroke-width="0.5"/>
    <circle cx="90" cy="78" r="3" fill="#FF69B4" stroke="#2E2E2E" stroke-width="0.5"/>
    <text x="70" y="68" font-size="8" fill="#606060" text-anchor="middle">HfCl&#8324; / H&#8322;O pulses</text>

    <text x="70" y="195" class="stage-desc" text-anchor="middle">ALD HfO&#8322; on</text>
    <text x="70" y="205" class="stage-desc" text-anchor="middle">SiO&#8322; interlayer</text>
  </g>

  <!-- Arrow 2 -->
  <line x1="410" y1="150" x2="460" y2="150" stroke="#2E2E2E" stroke-width="3" marker-end="url(#processArrow)"/>
  <text x="435" y="143" font-size="9" text-anchor="middle">PVD</text>

  <!-- Stage 3: Metal gate deposition -->
  <g id="stage-3" transform="translate(470, 70)">
    <text x="10" y="10" class="panel-label">c</text>
    <rect x="0" y="20" width="140" height="160" rx="5" class="process-box"/>

    <text x="70" y="45" class="stage-title" text-anchor="middle">Metal Gate</text>

    <!-- Substrate -->
    <rect x="25" y="130" width="90" height="35" fill="#F2D7A9" stroke="#2E2E2E" stroke-width="0.8"/>
    <text x="70" y="151" font-size="10" text-anchor="middle" font-weight="600">Si</text>

    <!-- Interfacial oxide -->
    <rect x="25" y="122" width="90" height="8" fill="#7CB5E8" stroke="#2E2E2E" stroke-width="0.8"/>

    <!-- High-k layer -->
    <rect x="25" y="108" width="90" height="14" fill="#FFB6C1" stroke="#2E2E2E" stroke-width="0.8"/>

    <!-- TiN metal gate -->
    <rect x="25" y="86" width="90" height="22" fill="#606060" stroke="#2E2E2E" stroke-width="0.8"/>
    <text x="70" y="100" font-size="9" fill="#FFFFFF" text-anchor="middle" font-weight="600">TiN</text>

    <text x="70" y="195" class="stage-desc" text-anchor="middle">TiN work-function</text>
    <text x="70" y="205" class="stage-desc" text-anchor="middle">metal (ALD/PVD)</text>
  </g>

  <!-- Arrow 3 -->
  <line x1="620" y1="150" x2="670" y2="150" stroke="#2E2E2E" stroke-width="3" marker-end="url(#processArrow)"/>
  <text x="645" y="143" font-size="9" text-anchor="middle">Pattern</text>

  <!-- Stage 4: Gate etch -->
  <g id="stage-4" transform="translate(680, 70)">
    <text x="10" y="10" class="panel-label">d</text>
    <rect x="0" y="20" width="140" height="160" rx="5" class="process-box"/>

    <text x="70" y="45" class="stage-title" text-anchor="middle">Gate Etch</text>

    <!-- Substrate (full width) -->
    <rect x="25" y="130" width="90" height="35" fill="#F2D7A9" stroke="#2E2E2E" stroke-width="0.8"/>
    <text x="70" y="151" font-size="10" text-anchor="middle" font-weight="600">Si</text>

    <!-- Etched gate line (center column only) -->
    <rect x="55" y="122" width="30" height="8" fill="#7CB5E8" stroke="#2E2E2E" stroke-width="0.8"/>
    <rect x="55" y="108" width="30" height="14" fill="#FFB6C1" stroke="#2E2E2E" stroke-width="0.8"/>
    <rect x="55" y="86" width="30" height="22" fill="#606060" stroke="#2E2E2E" stroke-width="0.8"/>

    <!-- Photoresist mask on top -->
    <rect x="55" y="66" width="30" height="20" fill="#FF69B4" stroke="#2E2E2E" stroke-width="0.8"/>
    <text x="70" y="79" font-size="8" fill="#FFFFFF" text-anchor="middle">PR</text>

    <!-- Plasma ion flux -->
    <line x1="38" y1="55" x2="38" y2="120" stroke="#4EC9E0" stroke-width="1.5" marker-end="url(#plasmaArrow)"/>
    <line x1="102" y1="55" x2="102" y2="120" stroke="#4EC9E0" stroke-width="1.5" marker-end="url(#plasmaArrow)"/>

    <text x="70" y="195" class="stage-desc" text-anchor="middle">Anisotropic Cl&#8322;-based</text>
    <text x="70" y="205" class="stage-desc" text-anchor="middle">plasma etch</text>
  </g>

  <!-- Cycle back arrow -->
  <path d="M 450,250 Q 450,290 200,290 Q 100,290 100,250" fill="none" stroke="#4EC9E0" stroke-width="2.5" stroke-dasharray="5,5" marker-end="url(#cycleArrow)"/>
  <text x="275" y="305" font-size="10" fill="#4EC9E0" text-anchor="middle">Repeat for next patterning level</text>

</svg>
